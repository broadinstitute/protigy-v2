name: shinytest2-on-demand

on:
  workflow_dispatch:

jobs:
  shinytest2:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Explicitly enable shinytest2 for this opt-in workflow.
      PROTIGY_SKIP_SHINYTEST2: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: browser-actions/setup-chrome@v1

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::shinytest2
            any::chromote
            any::devtools
          needs: check

      - name: Run shinytest2 test files
        shell: Rscript {0}
        run: |
          devtools::test(filter = "shinytest2")
