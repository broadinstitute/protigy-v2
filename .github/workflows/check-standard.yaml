# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: macOS checks have been removed due to persistent pak-related errors (e.g., "there is no package called 'pak'"
# or "error in pak subprocess"). These are known issues with the r-lib/actions setup-r-dependencies action on macOS.
# The package checks successfully on Windows and Ubuntu platforms.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Skip pak's automatic system-requirement installation. Chrome is
      # provided by the dedicated setup-chrome step below, so we don't need
      # pak to fetch Chromium via the xtradeb/apps PPA (which has been
      # timing out on Launchpad). All other sysreqs are present on the
      # GitHub-hosted runner image baseline.
      PKG_SYSREQS: "false"

    steps:
      - uses: actions/checkout@v3

      # Pre-install Chrome so chromote/shinytest2 can find a browser. We
      # pre-install rather than relying on pak's default sysreq install
      # path, which uses the xtradeb/apps PPA (Launchpad) and has been
      # timing out. Cross-platform via browser-actions/setup-chrome (puts
      # a real Chrome binary on PATH; avoids snap/apt transitional-package
      # flakiness on Ubuntu 24.04).
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

